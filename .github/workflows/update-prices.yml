name: Update prices
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-data.js
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          MEALDB_KEY: ${{ secrets.MEALDB_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A data
          git commit -m "Update prices" || exit 0
          git push
