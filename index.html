<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrepWell – Cheaper Meal Prep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#182019;--mut:#667068;--line:#dfe5df;--ac:#2d6a4f;--soft:#e6f2ea;--warn:#fff4d6;--bad:#a44a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111812;--card:#1a241c;--ink:#e9efe9;--mut:#9aa89c;--line:#2b392d;--ac:#6fcf97;--soft:#223426;--warn:#3a3318;--bad:#e08b8b}}
*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 8px;max-width:720px;margin:auto}h1{font-size:21px;margin:0}.s{color:var(--mut);font-size:13px}main{max-width:720px;margin:auto;padding:0 14px 20px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.c h2{font-size:16px;margin:0 0 8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:800}.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}.bar i.o{background:var(--bad)}
button,select,input{font:inherit;color:var(--ink)}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px;color:var(--mut)}
.b{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.b.x{background:var(--soft);color:var(--ink)}.b.sm{padding:6px 10px;font-size:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
.tabs button{background:none;border:0;padding:9px 2px;font-size:11px;font-weight:700;color:var(--mut)}.tabs button.on{color:var(--ac)}.tabs span{display:block;font-size:20px}
.pill{display:inline-block;background:var(--soft);color:var(--ac);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:4px}.pill.d{background:#ffe3b8;color:#7a4a00}
.note{background:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin:10px 0}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}.it input[type=checkbox]{width:20px;height:20px;flex:none}.it.dn .n{text-decoration:line-through;opacity:.5}.n{flex:1;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.chips button{flex:none}
details summary{cursor:pointer;list-style:none}ol{padding-left:18px;margin:6px 0;font-size:13px;line-height:1.5}.hid{display:none}

:root{--bg:#f7f3ec;--card:#fffdf9;--ink:#23201b;--mut:#7a7366;--line:#e8e0d2;--ac:#1f4d3a;--soft:#ece6d8;--warn:#f6ecd0;--gold:#b08d57}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14120f;--card:#1e1b16;--ink:#f1ece2;--mut:#a39a89;--line:#332e26;--ac:#d6b979;--soft:#2a261e;--warn:#3a3218;--gold:#d6b979}}
body{font-family:Inter,system-ui,-apple-system,sans-serif}
h1,h2,.big,.brand{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
header.hd{max-width:none;margin:0 0 12px;padding:22px 20px 26px;background:linear-gradient(135deg,#14322a,#1f4d3a);color:#f4efe4;border-radius:0 0 28px 28px}
.hd .in{max-width:720px;margin:auto}.brand{font-size:28px}.hd .s{color:#cdd8c8}.hd i{color:#d6b979;font-style:normal}
.c{border-radius:20px;box-shadow:0 8px 28px rgba(60,45,15,.07);padding:18px;animation:fi .35s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.b{border-radius:999px;padding:11px 18px;transition:transform .15s}.b:active{transform:scale(.97)}.b.sm{padding:7px 13px}
input,select{border-radius:12px}.bar{height:8px}.bar i{background:linear-gradient(90deg,var(--ac),var(--gold))}
.pill{background:var(--soft);color:var(--ac)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;margin:5px 5px 0 0;font-weight:600;font-size:13px;cursor:pointer}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tabs{left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 24px);max-width:696px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(40,30,10,.15);padding-bottom:0;overflow:hidden}
.tabs button.on{background:var(--soft);color:var(--ac)}body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.qz h1{font-size:26px;margin:12px 0 4px}.qz a{color:var(--mut)}

.hd{position:relative;overflow:hidden}.hd .fx{position:absolute;right:14px;top:14px;font-size:30px;display:flex;gap:4px}.hd .fx span{display:inline-block;animation:bob 4s ease-in-out infinite}.hd .fx span:nth-child(2){animation-delay:.7s}.hd .fx span:nth-child(3){animation-delay:1.4s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-8deg)}}
.tip{margin-top:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;font-size:12.5px;color:#eae3d2;line-height:1.45}
.hero{display:flex;gap:16px;align-items:center}.ring{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}.st{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center}.st b{display:block;font-family:Fraunces,Georgia,serif;font-size:18px}.st span{font-size:11px;color:var(--mut)}
.meals{display:flex;gap:8px;margin:8px 0}.meals span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--soft);transition:transform .2s}.meals span:hover{transform:rotate(-6deg) scale(1.08)}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;margin-right:10px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.it input[type=checkbox]{accent-color:var(--ac)}.it input:checked{animation:pop .3s}@keyframes pop{50%{transform:scale(1.35)}}
.tabs button span{transition:transform .2s}.tabs button.on span{transform:translateY(-2px) scale(1.15)}
.cf{position:fixed;top:-30px;font-size:24px;z-index:30;pointer-events:none;animation:fall 1.9s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.5}}
.c:hover{box-shadow:0 10px 32px rgba(60,45,15,.1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px}.hs .chip{flex:none;margin:0}
.rc{flex:0 0 70%;max-width:250px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 6px 20px rgba(60,45,15,.06);transition:transform .2s}.rc:active{transform:scale(.98)}
.rc .ph,.sh .ph{height:118px;display:grid;place-items:center;font-size:58px;position:relative}.rc .bd{padding:12px}.rc b{font-family:Fraunces,Georgia,serif;font-size:16px;display:block;line-height:1.25;margin-bottom:3px}
.tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.88);color:#23201b;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-top:6px}.grid .rc{max-width:none}.grid .ph{height:96px;font-size:46px}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px}.sec h2{font-size:20px;margin:0;font-family:Fraunces,Georgia,serif}
#sheet{position:fixed;inset:0;z-index:40;display:none}#sheet.on{display:block}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:auto;max-height:90vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s ease}.sh .ph{height:170px;font-size:84px}.sh .in{padding:16px 18px}
.sh .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#23201b;font-size:15px;cursor:pointer}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.day{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.5}.day:last-of-type{border:0}.day b{width:36px;flex:none;color:var(--mut)}

['Where do you shop?','We compare prices for each size across these stores.',()=>Object.keys(SI).map(s=>chip(S.stores.includes(s),`tg('stores','${s}')`,s)).join('')+`<label class="agree"><input type="checkbox" ${S.agree?'checked':''} onchange="S.agree=this.checked;save()"><span>I agree to the <a href="#" onclick="legal('terms');return false">Terms of Service</a> and <a href="#" onclick="legal('privacy');return false">Privacy Policy</a>. I understand prices are estimates and I should always check product labels for allergens.</span></label>`]];
function qall(){const g={};Object.keys(ING).forEach(i=>(g[ING[i].a]=g[ING[i].a]||[]).push(i));return Object.entries(g).map(([a,l])=>`<div class="s" style="margin-top:10px"><b>${a}</b></div>${l.sort((x,y)=>ING[x].n.localeCompare(ING[y].n)).map(i=>chip(S.dis.includes(i),`dt('${i}')`,esc(ING[i].n))).join('')}`).join('')}
const exC=()=>`<input id="qsx" placeholder="🔎 Search any food…" oninput="qsr()" autocomplete="off" aria-label="Search any food"><div id="qres"></div><label>Common picks</label>${DIS.map(([l,ids],k)=>chip(ids.every(i=>S.dis.includes(i)),`tgd(${k})`,l)).join('')}${chip(false,"$('qsx').focus()",'➕ Other foods…')}<details class="faq"><summary>Browse every grocery item (${Object.keys(ING).length})</summary><div id="qall">${qall()}</div></details><label>Your “won’t eat” list</label><div id="qsel">${qsel()}</div>`;
function fixPlan(){if(!S.done||!S.plan)return 0;let n=0;S.plan.forEach(p=>{const fix=(t,cur,set)=>{if(!RM[cur]||ok(RM[cur]))return;const l=pool(t).filter(r=>!p.m.includes(r.id)&&r.id!=p.b).sort((a,b)=>(rcs(a)-pref(a))-(rcs(b)-pref(b)));if(l.length){set(l[0].id);n++}};fix('b',p.b,v=>p.b=v);p.m.forEach((id,j)=>fix('m',id,v=>p.m[j]=v))});if(n){SPc=null;save()}return n}
function nev(i){if(!S.dis.includes(i))S.dis=S.dis.concat(i);save();const n=fixPlan();toast(`🚫 ${ING[i].n} won’t be used${n?`, swapped ${pl(n,'meal')}`:''}`);draw();if(LAST)LAST()}
const avoidN=r=>{const b=Object.keys(r.ing).filter(i=>S.dis.includes(i)).map(i=>ING[i].n).concat(S.disx.filter(t=>has(r,t)));return b.length?`<div class="note">🚫 Contains ${esc((b.length>1?b.slice(0,-1).join(', ')+' and '+b[b.length-1]:b[0]).toLowerCase())}, which you’ve chosen to avoid. It won’t be added to your plans.</div>`:''};
function qsel(){const l=S.dis.map(i=>[ING[i].n,`dx('i','${i}')`]).concat(S.disx.map((t,k)=>[t,`dx('x',${k})`]));return l.length?l.map(([n,js])=>chip(true,js,esc(n)+' ✕')).join(''):'<div class="s">Nothing yet.</div>'}
function dx(t,v){if(t=='i')S.dis=S.dis.filter(x=>x!=v);else S.disx.splice(v,1);save();qref()}
function qref(){if($('qsel'))$('qsel').innerHTML=qsel();if($('qall'))$('qall').innerHTML=qall();qsr();const n=fixPlan();if(n)toast(`↻ Swapped ${pl(n,'meal')} to match your list`)}
function qsr(){const e=$('qsx'),o=$('qres');if(!e||!o)return;const v=e.value.trim().toLowerCase();if(!v){o.innerHTML='';return}
 const hits=Object.keys(ING).filter(i=>ING[i].n.toLowerCase().includes(v)||(v.length>3&&v.endsWith('s')&&ING[i].n.toLowerCase().includes(v.slice(0,-1)))),n=R.filter(r=>has(r,v)).length,on=S.disx.includes(v);
 o.innerHTML=`<div style="margin-top:8px">${hits.map(i=>chip(S.dis.includes(i),`dt('${i}')`,esc(ING[i].n))).join('')}${hits.some(i=>ING[i].n.toLowerCase()==v)?'':chip(on,'dadd()',(on?'✓ Avoiding “':'➕ Avoid “')+esc(v)+'”')}</div><div class="s" style="margin-top:6px">${n?`${n} recipe${n>1?'s':''} include “${esc(v)}”.`:`No recipes use “${esc(v)}” right now, but we’ll keep avoiding it as recipes are added.`}</div>`}
function dt(i){S.dis=S.dis.includes(i)?S.dis.filter(x=>x!=i):S.dis.concat(i);save();qref()}
function dadd(){const v=$('qsx').value.trim().toLowerCase();if(!v)return;const on=S.disx.includes(v);S.disx=on?S.disx.filter(x=>x!=v):S.disx.concat(v);save();qref();if(!on)toast('🚫 Skipping anything with '+v)}
function vQuiz(){const q=QZ[S.qz],n=QZ.length;return `<div class="c qz"><div class="s">Step ${S.qz+1} of ${n}</div><div class="bar"><i style="width:${(S.qz+1)/n*100}%"></i></div><h1>${q[0]}</h1><div class="s" style="margin-bottom:8px">${q[1]}</div>${q[2]()}<div class="r" style="margin-top:20px">${S.qz?'<button class="b x" onclick="S.qz--;draw()">Back</button>':'<span></span>'}<button class="b" onclick="qn()">${S.qz==n-1?'Build my plan':'Next'}</button></div><div style="text-align:center;margin-top:12px"><a class="s" href="#" onclick="qn(1);return false">Skip for now</a></div></div>`}
function qn(skip){if(!skip&&S.qz<QZ.length-1){S.qz++;draw()}else{if(!S.agree){if(S.qz!=QZ.length-1){S.qz=QZ.length-1;draw()}return toast('Please accept the terms to continue')}if(!S.stores.length)S.stores=['Walmart'];if(!S.ml.some(x=>x!='b'))S.ml.push('d');S.done=true;S.tab='plan';S.pw=0;S.got={};S.seed++;gen();draw();confetti();toast('🎉 Your plan is ready!')}}
// ---------- savings, help, feedback, legal ----------
const SUPPORT='support@yourdomain.com',LEGAL_DRAFT=true;let FB={};
const savM=o=>o.base?o.base/4.33*o.weeks-o.spent:0;
function trk(){const wk=S.base?S.base/4.33:0,log=Object.values(S.spent).filter(v=>v>0),tot=log.reduce((a,v)=>a+v,0),sav=wk*log.length-tot,life=S.months.reduce((a,o)=>a+savM(o),0)+(S.base?sav:0),last=S.months[S.months.length-1];
 return `<div class="c"><div class="r"><h2>💰 Savings tracker</h2>${log.length&&S.base?`<span class="pill">${sav>=0?'saved '+m$(sav):m$(-sav)+' over'}</span>`:''}</div><div class="s">${S.base?`Log what you actually spend each week. We compare it with your usual ${m$(wk)} a week.`:'Add what you usually spend in a month to see how much PrepWell saves you.'}</div>
 ${S.base?'':`<label>Usual monthly grocery spending ($)</label><input type="number" min="0" inputmode="decimal" placeholder="e.g. 650" onchange="S.base=+this.value||0;save();draw()">`}
 ${S.base&&(S.months.length||log.length)?`<div class="stats"><div class="st"><b>${m$(Math.max(0,sav))}</b><span>this month</span></div><div class="st"><b>${m$(Math.max(0,life))}</b><span>lifetime savings</span></div><div class="st"><b>${S.months.length+1}</b><span>${S.months.length?'months':'month'} with PrepWell</span></div></div>`:''}${last&&savM(last)>0?`<div class="note">🎉 You saved <b>${m$(savM(last))}</b> in ${mName(last.m)}. <a href="#" onclick="shareSav(${savM(last).toFixed(2)});return false">Share it</a></div>`:''}<div class="g4">${[0,1,2,3].map(w=>`<div><label>Week ${w+1}</label><input type="number" min="0" inputmode="decimal" placeholder="plan ${m$(SP().a.W[w].c)}" value="${S.spent[w]||''}" onchange="S.spent[${w}]=+this.value||0;save();draw();if(+this.value)toast('✓ Spending logged')"></div>`).join('')}</div></div>`}
let LAST=null;
const mName=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleString('en-US',{month:'long'})};
function rateB(id){return `<div class="hs" style="padding:2px 0 6px">${chip(S.rate[id]==1,`rate('${id}',1)`,'👍 Loved it')}${chip(S.rate[id]==-1,`rate('${id}',-1)`,'👎 Not for us')}</div>`}
function rate(id,v){if(S.rate[id]==v)delete S.rate[id];else{S.rate[id]=v;toast(v==1?'❤️ We’ll bring this back more often':'👎 We won’t add this to future plans')}save();SPc=null;if(LAST)LAST();draw()}
function shareSav(n){const t=`I saved $${n} on groceries last month with PrepWell!`;try{if(navigator.share){navigator.share({text:t}).catch(()=>{});return}navigator.clipboard.writeText(t).then(()=>toast('📋 Copied, ready to share'),()=>prompt('Copy and share:',t))}catch(e){prompt('Copy and share:',t)}}
function newMonth(){const{a}=SP(),log=Object.values(S.spent).filter(v=>v>0);S.months.push({m:S.mon||today().slice(0,7),planned:+a.total.toFixed(2),spent:log.reduce((x,v)=>x+v,0),weeks:log.length,base:S.base});
 S.prev=[...new Set(S.plan.flatMap(p=>[p.b,...p.m]))];S.spent={};S.got={};S.pw=0;S.lw=0;S.mon=today().slice(0,7);S.seed++;gen();draw();confetti();toast('🗓️ Your new month is ready')}
function nmC(){return S.mon&&S.mon<today().slice(0,7)?`<div class="c save"><div class="r"><div><h2>🗓️ Welcome to ${mName(today().slice(0,7))}!</h2><div class="s">Start a fresh plan with new recipes, your favorites and this month’s prices.</div></div><button class="b sm" onclick="newMonth()">Start</button></div></div>`:''}
function obC(){if(S.obHide||S.months.length)return '';const it=[['Finish the quiz',1],['Open a recipe',S.ob.view],['Check off an item on your shopping list',S.ob.shop],['Cook a meal in cook mode',S.ob.cook],['Rate a meal you made',Object.keys(S.rate).length],['Log what you spent in week 1',S.spent[0]>0]],n=it.filter(x=>x[1]).length;
 if(n==it.length&&!S.ob.done){S.ob.done=1;save();setTimeout(()=>{confetti();toast('🏆 First week complete!')},300)}
 return `<div class="c"><div class="r"><h2>🚀 Your first week</h2><span class="pill">${n} of ${it.length}</span></div><div class="bar"><i style="width:${n/it.length*100}%"></i></div>${it.map(([t,d])=>`<div class="ck">${d?'✅':'⬜'} ${t}</div>`).join('')}<button class="b x sm" style="margin-top:8px" onclick="S.obHide=true;save();draw()">${n==it.length?'Hide checklist':'Hide for now'}</button></div>`}
const FAQ=[['How are prices calculated?','Each item is priced by the sizes stores actually sell, using estimates for your area until you log a shelf price, add a deal or connect a price source. Prices tagged “live” come from a connected source. Actual store prices vary.'],['Where do weekly deals come from?','When connected, PrepWell reads stores’ weekly ads and matches sale items to recipe ingredients by name. Deals can require a loyalty card, digital coupon or minimum purchase, so check the deal terms shown on your list.'],['How do I stop seeing a food?','Go to You → Foods I won’t eat. Search for anything, browse every grocery item, or tap 🚫 next to an ingredient in a recipe. Meals in your plan that contain it are swapped automatically.'],['How do allergy filters work?','Recipes containing an allergen you choose are hidden based on our ingredient list. Brands vary, so always check product labels, especially for severe allergies.'],['Why are some items “already in your kitchen”?','When a larger size is cheaper, you buy it once and the extra carries into later weeks. Fresh produce doesn’t carry over.'],['How do I change my meals?','Tap ↻ Swap on any meal, open a recipe and add it to a week, or retake the quiz to update your preferences.'],['How do ratings work?','Tap 👍 or 👎 on any recipe or at the end of cook mode. Meals you love come back more often, and meals you rate 👎 are left out of future plans.'],['What happens at the end of the month?','Tap Start next month on the Plan tab. Your savings are saved to your lifetime total, and you get a fresh plan that favors new recipes and your favorites.'],['Where is my data stored?','On this device, in your browser. Nothing is sent to us unless you send feedback or connect a price source. Clearing your browser data erases it.']];
function moreC(){return `<div class="c"><h2>Display</h2>${chip(S.txt!='l',"S.txt='m';save();draw()",'Standard text')}${chip(S.txt=='l',"S.txt='l';save();draw()",'Larger text')}</div>
<div class="c"><h2>Help</h2>${FAQ.map(([q,a])=>`<details class="faq"><summary>${q}</summary><div class="s">${a}</div></details>`).join('')}</div>
<div class="c"><h2>💬 Send feedback</h2><div class="s">PrepWell is in beta. Tell us what works and what doesn’t.</div><label>How useful is PrepWell so far?</label>${[1,2,3,4,5].map(n=>chip(FB.r==n,`FB.r=${n};draw()`,'★'.repeat(n))).join('')}<label>What would you pay per month?</label>${['$0','$3','$5','$7','$10+'].map(v=>chip(FB.p==v,`FB.p='${v}';draw()`,v)).join('')}<label>What should we improve?</label><textarea id="fbt" rows="3" placeholder="Your thoughts…" oninput="FB.t=this.value">${esc(FB.t||'')}</textarea><button class="b" style="width:100%;margin-top:10px" onclick="sendFb()">Send feedback</button></div>
<div class="c"><h2>Legal &amp; data</h2><div class="hs"><button class="chip" onclick="legal('terms')">Terms of Service</button><button class="chip" onclick="legal('privacy')">Privacy Policy</button><button class="chip" onclick="expData()">Copy my data</button></div><button class="b x" style="width:100%;margin-top:8px" onclick="if(confirm('Delete all your PrepWell data on this device?')){S=D0();gen();draw();toast('All data deleted')}">Delete all my data</button></div>
<div class="s" style="text-align:center;margin:8px 0 20px">PrepWell is a planning tool and doesn’t give medical, nutrition or allergy advice.<br>Questions? <a href="mailto:${SUPPORT}">${SUPPORT}</a></div>`}
function sendFb(){const t=($('fbt')&&$('fbt').value)||FB.t||'';if(!FB.r&&!t)return toast('Add a rating or a comment first');S.fb.push({d:today(),r:FB.r||null,p:FB.p||null,t});save();
 const body=`Rating: ${FB.r||'-'}/5\nWould pay per month: ${FB.p||'-'}\n\n${t}`;FB={};draw();toast('🙏 Thanks! Opening your email app');try{location.href='mailto:'+SUPPORT+'?subject='+encodeURIComponent('PrepWell beta feedback')+'&body='+encodeURIComponent(body)}catch(e){}}
function expData(){const t=JSON.stringify(S,null,1);try{navigator.clipboard.writeText(t).then(()=>toast('📋 Your data was copied'),()=>prompt('Copy your data:',t))}catch(e){prompt('Copy your data:',t)}}
const LEGAL={terms:['Terms of Service',[['About PrepWell','PrepWell is a meal-planning and grocery-budgeting tool provided by [COMPANY NAME] (“we”). By using it, you agree to these terms.'],['Estimates, not guarantees','Prices, savings, nutrition and cook times are estimates. Store prices, sizes, deals and availability change and vary by location, so always confirm prices at the store.'],['Not medical, nutrition or allergy advice','PrepWell doesn’t provide medical or dietary advice. Allergy and diet filters are based on our ingredient data and may be incomplete. Always read product labels, and talk to a professional about allergies or dietary needs.'],['Food safety','You’re responsible for safe food handling, cooking food to safe temperatures and storing it properly.'],['Third-party content','Some recipes and price data come from third parties and are provided as is. Links to other sites are for convenience only.'],['Subscriptions','If you buy a paid plan, the price, billing, renewal and cancellation terms will be shown before you pay. [ADD REFUND POLICY]'],['Acceptable use','Don’t misuse the service, try to break it or scrape it.'],['No warranties and limits of liability','The service is provided “as is” without warranties. To the extent the law allows, we aren’t liable for indirect or consequential damages, and our total liability is limited to what you paid us in the past 12 months.'],['Changes','We may update these terms and will change the date at the top when we do.'],['Contact and governing law','Contact us at [CONTACT EMAIL]. These terms are governed by the laws of [STATE].']]],
privacy:['Privacy Policy',[['What we collect','Information you enter: ZIP code, household size, budget, food preferences, allergies and foods you avoid, prices and spending you log, and any feedback you send.'],['Where it’s stored','On your device, in your browser’s storage. This version doesn’t have user accounts and doesn’t store your data on our servers.'],['What’s shared','If you connect a price source, your ZIP code and chosen stores are sent to it to look up prices. The app loads fonts from Google Fonts, which receives your IP address. Weekly-ad links open a Google search. Feedback you send goes to us by email.'],['Sensitive information','Allergy and diet details can be sensitive. They stay on your device and are only used to filter recipes.'],['Selling data','We don’t sell your personal information.'],['Your choices','You can copy or delete your data at any time under You → Legal & data. Clearing your browser data also removes it.'],['Children','PrepWell isn’t directed to children under 13.'],['Changes and contact','We’ll update the date at the top when this policy changes. Contact us at [CONTACT EMAIL].']]]};
function legal(k){const[t,secs]=LEGAL[k];$('sheet').innerHTML=`<div class="scrim" onclick="closeS()"></div><div class="sh"><div class="in"><div class="r"><h1 style="font-size:24px;margin:0">${t}</h1><button class="b x sm" onclick="closeS()" aria-label="Close">✕</button></div><div class="s">Last updated [DATE]</div>${LEGAL_DRAFT?'<div class="note">Draft for legal review. Replace the bracketed placeholders before launch.</div>':''}${secs.map(([h,p])=>`<h2 style="margin-top:14px">${h}</h2><p class="s" style="font-size:14px;line-height:1.55">${p}</p>`).join('')}</div></div>`;$('sheet').classList.add('on')}
draw();loadFeed();syncPrices();loadRecipes();
</script></body></html>
